AWSTemplateFormatVersion: "2010-09-09"

Description: >
  GET /items/{id} - read-through cache: ElastiCache (Valkey) first, then
  DynamoDB (result is written back to the cache).

Parameters:
  InfrastructureName:
    Type: String
  EnvironmentType:
    Type: String
    AllowedValues: [dev, test, prod]
  LambdaFunctionFileName:
    Type: String
    Description: Derived from the folder path by scripts/deploy.sh (items-id-get)
  ResourceKey:
    Type: String
    Description: API resource export suffix (items-id)
  HttpMethod:
    Type: String
    AllowedValues: [GET, POST, PUT, PATCH, DELETE]
  CommonLayerArn:
    Type: String
  LambdaMemorySize:
    Type: Number
    Default: 512
  LambdaTimeout:
    Type: Number
    Default: 15
  LogLevel:
    Type: String
    Default: INFO
  LogRetentionDays:
    Type: Number
    Default: 14
  CacheTtlSeconds:
    Type: Number
    Default: 300

Resources:
  FunctionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${InfrastructureName}-${EnvironmentType}-fn-${LambdaFunctionFileName}
      PermissionsBoundary: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:policy/boundaries/${InfrastructureName}-${EnvironmentType}-boundary
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
        - !ImportValue
          Fn::Sub: ${InfrastructureName}-${EnvironmentType}-ItemsTableReadOnlyPolicy

  FunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${InfrastructureName}-${EnvironmentType}-${LambdaFunctionFileName}
      RetentionInDays: !Ref LogRetentionDays

  LambdaFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub ${InfrastructureName}-${EnvironmentType}-${LambdaFunctionFileName}
      Handler: lambda_function.handler
      Runtime: python3.12
      Architectures: [arm64]
      Code: ./src
      Role: !GetAtt FunctionRole.Arn
      MemorySize: !Ref LambdaMemorySize
      Timeout: !Ref LambdaTimeout
      Layers:
        - !Ref CommonLayerArn
      LoggingConfig:
        LogGroup: !Ref FunctionLogGroup
        LogFormat: JSON
        ApplicationLogLevel: !Ref LogLevel
        SystemLogLevel: WARN
      VpcConfig:
        SubnetIds:
          - !ImportValue
            Fn::Sub: ${InfrastructureName}-${EnvironmentType}-PrivateSubnet1
          - !ImportValue
            Fn::Sub: ${InfrastructureName}-${EnvironmentType}-PrivateSubnet2
        SecurityGroupIds:
          - !ImportValue
            Fn::Sub: ${InfrastructureName}-${EnvironmentType}-LambdaSecurityGroup
      Environment:
        Variables:
          ENV_TYPE: !Ref EnvironmentType
          ITEMS_TABLE_NAME: !ImportValue
            Fn::Sub: ${InfrastructureName}-${EnvironmentType}-ItemsTableName
          CACHE_HOST: !ImportValue
            Fn::Sub: ${InfrastructureName}-${EnvironmentType}-CacheEndpoint
          CACHE_PORT: !ImportValue
            Fn::Sub: ${InfrastructureName}-${EnvironmentType}-CachePort
          CACHE_TTL_SECONDS: !Ref CacheTtlSeconds

  ApiGatewayMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !ImportValue
        Fn::Sub: ${InfrastructureName}-${EnvironmentType}-RestApiId
      ResourceId: !ImportValue
        Fn::Sub: ${InfrastructureName}-${EnvironmentType}-ApiResource-${ResourceKey}
      HttpMethod: !Ref HttpMethod
      AuthorizationType: NONE
      RequestValidatorId: !ImportValue
        Fn::Sub: ${InfrastructureName}-${EnvironmentType}-RequestParametersValidator
      RequestParameters:
        method.request.path.id: true
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${LambdaFunction.Arn}:live/invocations

Outputs:
  FunctionName:
    Value: !Ref LambdaFunction
