AWSTemplateFormatVersion: "2010-09-09"

Description: >
  Application secrets (e.g. third-party API keys). The database secret is
  created and rotated by RDS in database.yml.

Parameters:
  InfrastructureName:
    Type: String
  EnvironmentType:
    Type: String
    AllowedValues: [dev, test, prod]

Resources:
  AppSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub ${InfrastructureName}/${EnvironmentType}/app
      Description: !Sub Application secrets for ${InfrastructureName}-${EnvironmentType}
      GenerateSecretString:
        SecretStringTemplate: "{}"
        GenerateStringKey: apiKey
        PasswordLength: 32
        ExcludePunctuation: true

Outputs:
  AppSecretArn:
    Value: !Ref AppSecret
    Export:
      Name: !Sub ${InfrastructureName}-${EnvironmentType}-AppSecretArn
