AWSTemplateFormatVersion: "2010-09-09"

Description: >
  ElastiCache (Valkey) replication group in the private subnets, encrypted at
  rest and in transit.

Parameters:
  InfrastructureName:
    Type: String
  EnvironmentType:
    Type: String
    AllowedValues: [dev, test, prod]
  CacheEngineVersion:
    Type: String
    Default: "7.2"
  CacheNodeType:
    Type: String
    Default: cache.t4g.micro
  CacheNumNodes:
    Type: Number
    MinValue: 1
    MaxValue: 6
    Default: 1

# TEMPORARILY DISABLED to save cost (replication group below is commented out).
# The Cache* parameters stay declared so re-enabling is just uncommenting.
Metadata:
  cfn-lint:
    config:
      ignore_checks:
        - W2001   # Cache* parameters unused while the cache is disabled

# Conditions:
#   IsMultiNode: !Not [!Equals [!Ref CacheNumNodes, "1"]]

Resources:
  CacheSubnetGroup:
    Type: AWS::ElastiCache::SubnetGroup
    Properties:
      Description: !Sub ${InfrastructureName}-${EnvironmentType} cache subnets
      SubnetIds:
        - !ImportValue
          Fn::Sub: ${InfrastructureName}-${EnvironmentType}-PrivateSubnet1
        - !ImportValue
          Fn::Sub: ${InfrastructureName}-${EnvironmentType}-PrivateSubnet2

  # TEMPORARILY DISABLED to save cost: Valkey replication group removed.
  # CacheSubnetGroup is kept (free) so the stack still has a resource and
  # re-enabling is just uncommenting.
  # While disabled, GET /health/deps reports cache as failed (503) and
  # GET /items/{id} always reads from DynamoDB (cache is best effort).
