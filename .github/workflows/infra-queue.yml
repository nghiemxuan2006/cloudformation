name: infra / queue

# Pipeline of the fixed stack <infra>-<env>-queue (templates/infrastructure/queue.yml).
# Runs when that template or the environment parameters change.
on:
  push:
    branches: [dev, test, main]
    paths:
      - templates/infrastructure/queue.yml
      - parameters/**
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to deploy
        type: choice
        options: [dev, test, prod]
        required: true

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    uses: ./.github/workflows/_deploy.yml
    with:
      scope: infrastructure
      stack: queue
      environment: ${{ inputs.environment }}
      lint-paths: templates/infrastructure/queue.yml
