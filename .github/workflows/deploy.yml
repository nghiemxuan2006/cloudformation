name: Deploy

# Branch -> environment mapping:
#   dev  -> dev
#   test -> test
#   main -> prod   (GitHub Environment "prod" should require reviewers)
on:
  push:
    branches: [dev, test, main]
    paths-ignore:
      - '**.md'
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to deploy
        type: choice
        options: [dev, test, prod]
        required: true

permissions:
  id-token: write   # OIDC -> AWS
  contents: read

# Never run two deployments of the same environment at once.
concurrency:
  group: deploy-${{ github.event.inputs.environment || github.ref_name }}
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve environment
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.env.outputs.environment }}
    steps:
      - id: env
        run: |
          if [[ -n "${{ github.event.inputs.environment }}" ]]; then
            env="${{ github.event.inputs.environment }}"
          else
            case "${{ github.ref_name }}" in
              dev)  env=dev ;;
              test) env=test ;;
              main) env=prod ;;
              *) echo "::error::No environment mapped for branch ${{ github.ref_name }}"; exit 1 ;;
            esac
          fi
          echo "environment=$env" >> "$GITHUB_OUTPUT"
          echo "Deploying to **$env**" >> "$GITHUB_STEP_SUMMARY"

  validate:
    name: Lint & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install cfn-lint pytest boto3 -r src/api/requirements.txt
      - run: cfn-lint
      - run: pytest -q

  deploy:
    name: Deploy (${{ needs.resolve.outputs.environment }})
    needs: [resolve, validate]
    runs-on: ubuntu-latest
    # Variables/secrets and protection rules come from the GitHub Environment.
    environment: ${{ needs.resolve.outputs.environment }}
    env:
      ENVIRONMENT: ${{ needs.resolve.outputs.environment }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      ARTIFACT_BUCKET: ${{ vars.ARTIFACT_BUCKET }}
      CFN_EXECUTION_ROLE_ARN: ${{ vars.CFN_EXECUTION_ROLE_ARN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: gha-${{ github.run_id }}

      - name: Deploy stack
        run: ./scripts/deploy.sh "$ENVIRONMENT"

      - name: Smoke test
        run: |
          project="$(jq -r '.Parameters.ProjectName' "infra/parameters/${ENVIRONMENT}.json")"
          api_url="$(aws cloudformation describe-stacks \
            --stack-name "${project}-${ENVIRONMENT}" \
            --query "Stacks[0].Outputs[?OutputKey=='ApiUrl'].OutputValue" \
            --output text)"
          echo "API: $api_url" >> "$GITHUB_STEP_SUMMARY"
          for i in 1 2 3 4 5; do
            if curl -fsS "$api_url/health"; then exit 0; fi
            sleep 10
          done
          echo "::error::Smoke test failed"
          exit 1
