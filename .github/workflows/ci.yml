name: CI

# Runs on every pull request into a deployment branch.
# Branch protection should require this workflow to pass before merging.
on:
  pull_request:
    branches: [dev, test, main]

permissions:
  contents: read

jobs:
  validate:
    name: Lint & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install tooling
        run: |
          python -m pip install --upgrade pip
          pip install cfn-lint pytest boto3 -r templates/layers/common/requirements.txt

      - name: cfn-lint
        run: cfn-lint

      - name: Validate parameter files match template parameters
        run: |
          for f in parameters/*.json; do
            env_name="$(basename "$f" .json)"
            jq -e --arg e "$env_name" '.Parameters.EnvironmentType == $e' "$f" > /dev/null \
              || { echo "::error file=$f::EnvironmentType must be '$env_name'"; exit 1; }
          done

      - name: Unit tests
        run: pytest -q

      - name: Build layers
        run: ./scripts/build-layers.sh
