name: _deploy

# Reusable workflow: every pipeline (one per stack) calls this with what to deploy.
# It is not triggered on its own.
#
# Branch -> environment:
#   dev  -> dev
#   test -> test
#   main -> prod   (GitHub Environment "prod" requires reviewers)
on:
  workflow_call:
    inputs:
      scope:
        description: all | infrastructure | layers | functions | api
        type: string
        required: true
      stack:
        description: Infrastructure stack name (templates/infrastructure/<stack>.yml)
        type: string
        default: ''
      environment:
        description: Override the branch -> environment mapping (workflow_dispatch)
        type: string
        default: ''
      lint-paths:
        description: Templates to cfn-lint before deploying (empty = all)
        type: string
        default: ''
      smoke-test:
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read

jobs:
  resolve:
    name: Resolve environment
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.env.outputs.environment }}
    steps:
      - id: env
        env:
          INPUT_ENV: ${{ inputs.environment }}
          BRANCH: ${{ github.ref_name }}
        run: |
          if [[ -n "$INPUT_ENV" ]]; then
            env="$INPUT_ENV"
          else
            case "$BRANCH" in
              dev)  env=dev ;;
              test) env=test ;;
              main) env=prod ;;
              *) echo "::error::No environment mapped for branch $BRANCH"; exit 1 ;;
            esac
          fi
          echo "environment=$env" >> "$GITHUB_OUTPUT"

  deploy:
    name: ${{ inputs.stack || inputs.scope }} -> ${{ needs.resolve.outputs.environment }}
    needs: resolve
    runs-on: ubuntu-latest
    environment: ${{ needs.resolve.outputs.environment }}
    # One deployment at a time per (environment, stack). Different stacks of the
    # same environment run in parallel; the "api" and "functions" groups are
    # shared with the layers pipeline so the same stacks never deploy twice at once.
    concurrency:
      group: deploy-${{ needs.resolve.outputs.environment }}-${{ inputs.stack || inputs.scope }}
      cancel-in-progress: false
    env:
      ENV_TYPE: ${{ needs.resolve.outputs.environment }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      ARTIFACT_BUCKET: ${{ vars.ARTIFACT_BUCKET }}
      CFN_EXECUTION_ROLE_ARN: ${{ vars.CFN_EXECUTION_ROLE_ARN }}
      COMMIT_HASH: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install tooling
        run: |
          python -m pip install --upgrade pip
          pip install cfn-lint pytest boto3 -r templates/layers/common/requirements.txt

      - name: cfn-lint
        run: |
          shopt -s globstar
          cfn-lint ${{ inputs.lint-paths }}

      - name: Unit tests
        if: inputs.scope != 'infrastructure'
        run: pytest -q

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: gha-${{ github.run_id }}

      - name: Deploy
        run: ./scripts/deploy.sh "$ENV_TYPE" "${{ inputs.scope }}" ${{ inputs.stack }}

      - name: Smoke test
        if: inputs.smoke-test
        run: |
          infra="$(jq -r '.Parameters.InfrastructureName' "parameters/${ENV_TYPE}.json")"
          api_url="$(aws cloudformation describe-stacks \
            --stack-name "${infra}-${ENV_TYPE}-api-stage" \
            --query "Stacks[0].Outputs[?OutputKey=='ApiUrl'].OutputValue" \
            --output text)"
          echo "API: $api_url" >> "$GITHUB_STEP_SUMMARY"
          for i in 1 2 3 4 5; do
            if curl -fsS "$api_url/health"; then exit 0; fi
            sleep 10
          done
          echo "::error::Smoke test failed"
          exit 1
