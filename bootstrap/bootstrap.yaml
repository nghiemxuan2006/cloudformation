AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  One-time bootstrap per environment/account - artifact bucket for
  `cloudformation package`, CloudFormation execution role, and a GitHub
  Actions OIDC deploy role scoped to a single GitHub Environment.
  Deploy manually with admin credentials as stack "bootstrap-<project>-<env>"
  (the name deliberately does NOT match the <project>-<env>-* pattern the
  pipeline is allowed to manage).

Parameters:
  ProjectName:
    Type: String
    AllowedPattern: '^[a-z][a-z0-9-]{1,11}$'
  Environment:
    Type: String
    AllowedValues: [dev, test, prod]
  GitHubOrg:
    Type: String
    Description: GitHub organization or user that owns the repository
  GitHubRepo:
    Type: String
    Description: Repository name (without org)
  CreateOidcProvider:
    Type: String
    AllowedValues: ['true', 'false']
    Default: 'true'
    Description: >-
      Only one GitHub OIDC provider may exist per AWS account. Set 'false'
      when another stack in this account already created it.

Conditions:
  ShouldCreateOidcProvider: !Equals [!Ref CreateOidcProvider, 'true']

Resources:
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: ShouldCreateOidcProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com

  ArtifactBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub ${ProjectName}-${Environment}-artifacts-${AWS::AccountId}-${AWS::Region}
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      LifecycleConfiguration:
        Rules:
          - Id: expire-old-artifacts
            Status: Enabled
            ExpirationInDays: 90

  ArtifactBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ArtifactBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource:
              - !GetAtt ArtifactBucket.Arn
              - !Sub ${ArtifactBucket.Arn}/*
            Condition:
              Bool:
                aws:SecureTransport: 'false'

  # ---------------------------------------------------------------------------
  # Permissions boundary - the MAXIMUM permissions any role created by the
  # application stacks can ever have. The execution role below can only create
  # roles that carry this boundary, so a template change can never mint an
  # admin role (privilege-escalation guard). Lives under /boundaries/ so the
  # execution role (scoped to policy/<project>-<env>-*) cannot edit it.
  # ---------------------------------------------------------------------------
  WorkloadPermissionsBoundary:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub ${ProjectName}-${Environment}-boundary
      Path: /boundaries/
      Description: !Sub Upper bound for workload roles of ${ProjectName}-${Environment}
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: Logs
            Effect: Allow
            Action:
              - logs:CreateLogGroup
              - logs:CreateLogStream
              - logs:PutLogEvents
              - logs:DescribeLogGroups
              - logs:DescribeLogStreams
            Resource: '*'
          - Sid: VpcNetworking
            Effect: Allow
            Action:
              - ec2:CreateNetworkInterface
              - ec2:DescribeNetworkInterfaces
              - ec2:DeleteNetworkInterface
              - ec2:AssignPrivateIpAddresses
              - ec2:UnassignPrivateIpAddresses
              - ec2:DescribeSubnets
              - ec2:DescribeVpcs
            Resource: '*'
          - Sid: DynamoDb
            Effect: Allow
            Action: dynamodb:*
            Resource:
              - !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${ProjectName}-${Environment}-*
          - Sid: S3
            Effect: Allow
            Action:
              - s3:GetObject
              - s3:PutObject
              - s3:DeleteObject
              - s3:ListBucket
            Resource:
              - !Sub arn:${AWS::Partition}:s3:::${ProjectName}-${Environment}-data-*
          - Sid: Secrets
            Effect: Allow
            Action:
              - secretsmanager:GetSecretValue
              - secretsmanager:DescribeSecret
            Resource:
              - !Sub arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${ProjectName}/${Environment}/*
              - !Sub arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:rds!*
          - Sid: Efs
            Effect: Allow
            Action:
              - elasticfilesystem:ClientMount
              - elasticfilesystem:ClientWrite
            Resource: '*'
          - Sid: Tracing
            Effect: Allow
            Action:
              - xray:PutTraceSegments
              - xray:PutTelemetryRecords
            Resource: '*'

  # ---------------------------------------------------------------------------
  # Role assumed by CloudFormation to create/update resources (least privilege).
  # Split into two managed policies to stay under the 6 KB policy size limit.
  # ---------------------------------------------------------------------------
  CloudFormationExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${ProjectName}-${Environment}-cfn-exec
      Path: /bootstrap/   # outside the role/<project>-<env>-* pattern the role itself may manage
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudformation.amazonaws.com
            Action: sts:AssumeRole

  CfnExecInfraPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub ${ProjectName}-${Environment}-cfn-exec-infra
      Path: /bootstrap/
      Roles:
        - !Ref CloudFormationExecutionRole
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: NestedStacks
            Effect: Allow
            Action: cloudformation:*
            Resource:
              - !Sub arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${ProjectName}-${Environment}/*
              - !Sub arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${ProjectName}-${Environment}-*/*
          - Sid: ReadPackagedArtifacts
            Effect: Allow
            Action:
              - s3:GetObject
              - s3:GetObjectVersion
            Resource: !Sub ${ArtifactBucket.Arn}/*
          # Services whose resource IDs are generated (vpc-xxx, fs-xxx, cluster
          # ids...) cannot be name-scoped, so they are limited to this region.
          - Sid: RegionScopedServices
            Effect: Allow
            Action:
              - ec2:*
              - rds:*
              - elasticache:*
              - elasticfilesystem:*
              - apigateway:*
              - secretsmanager:GetRandomPassword
              - kms:DescribeKey
              - kms:CreateGrant
              - logs:CreateLogDelivery
              - logs:GetLogDelivery
              - logs:UpdateLogDelivery
              - logs:DeleteLogDelivery
              - logs:ListLogDeliveries
              - logs:PutResourcePolicy
              - logs:DescribeResourcePolicies
              - logs:DescribeLogGroups
            Resource: '*'
            Condition:
              StringEquals:
                aws:RequestedRegion: !Ref AWS::Region
          # Private DNS for interface endpoints; Route 53 is global, so no region condition.
          - Sid: InterfaceEndpointPrivateDns
            Effect: Allow
            Action:
              - route53:AssociateVPCWithHostedZone
              - route53:DisassociateVPCFromHostedZone
            Resource: '*'
          - Sid: NameScopedLogs
            Effect: Allow
            Action: logs:*
            Resource:
              - !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${ProjectName}-${Environment}-*
              - !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/apigateway/${ProjectName}-${Environment}-*
              - !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/vpc/${ProjectName}-${Environment}/*
          - Sid: NameScopedData
            Effect: Allow
            Action:
              - s3:*
              - dynamodb:*
            Resource:
              - !Sub arn:${AWS::Partition}:s3:::${ProjectName}-${Environment}-data-*
              - !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${ProjectName}-${Environment}-*
          - Sid: NameScopedLambda
            Effect: Allow
            Action: lambda:*
            Resource: !Sub arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:${ProjectName}-${Environment}-*
          - Sid: AppSecrets
            Effect: Allow
            Action: secretsmanager:*
            Resource: !Sub arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${ProjectName}/${Environment}/*
          - Sid: RdsManagedMasterSecret
            Effect: Allow
            Action:
              - secretsmanager:CreateSecret
              - secretsmanager:TagResource
              - secretsmanager:RotateSecret
              - secretsmanager:DescribeSecret
              - secretsmanager:DeleteSecret
            Resource: !Sub arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:rds!*

  CfnExecIamPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub ${ProjectName}-${Environment}-cfn-exec-iam
      Path: /bootstrap/
      Roles:
        - !Ref CloudFormationExecutionRole
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: CreateRolesOnlyWithBoundary
            Effect: Allow
            Action:
              - iam:CreateRole
              - iam:PutRolePermissionsBoundary
              - iam:AttachRolePolicy
              - iam:DetachRolePolicy
              - iam:PutRolePolicy
              - iam:DeleteRolePolicy
            Resource: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${ProjectName}-${Environment}-*
            Condition:
              StringEquals:
                iam:PermissionsBoundary: !Ref WorkloadPermissionsBoundary
          - Sid: ManageProjectRoles
            Effect: Allow
            Action:
              - iam:GetRole
              - iam:GetRolePolicy
              - iam:ListRolePolicies
              - iam:ListAttachedRolePolicies
              - iam:ListRoleTags
              - iam:TagRole
              - iam:UntagRole
              - iam:UpdateRole
              - iam:UpdateRoleDescription
              - iam:UpdateAssumeRolePolicy
              - iam:DeleteRole
            Resource: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${ProjectName}-${Environment}-*
          - Sid: PassProjectRoles
            Effect: Allow
            Action: iam:PassRole
            Resource: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${ProjectName}-${Environment}-*
            Condition:
              StringEquals:
                iam:PassedToService:
                  - lambda.amazonaws.com
                  - vpc-flow-logs.amazonaws.com
          - Sid: ManageProjectPolicies
            Effect: Allow
            Action:
              - iam:CreatePolicy
              - iam:DeletePolicy
              - iam:CreatePolicyVersion
              - iam:DeletePolicyVersion
              - iam:GetPolicy
              - iam:GetPolicyVersion
              - iam:ListPolicyVersions
              - iam:ListEntitiesForPolicy
              - iam:TagPolicy
              - iam:UntagPolicy
            Resource: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:policy/${ProjectName}-${Environment}-*
          - Sid: ServiceLinkedRoles
            Effect: Allow
            Action: iam:CreateServiceLinkedRole
            Resource: '*'
            Condition:
              StringEquals:
                iam:AWSServiceName:
                  - rds.amazonaws.com
                  - elasticache.amazonaws.com
                  - elasticfilesystem.amazonaws.com
          # Defense in depth: the pipeline must never modify its own roles/policies.
          - Sid: NeverTouchBootstrapIam
            Effect: Deny
            NotAction:
              - iam:Get*
              - iam:List*
            Resource:
              - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/bootstrap/*
              - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:policy/bootstrap/*
              - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:policy/boundaries/*
          - Sid: NeverRemoveBoundaryFromRoles
            Effect: Deny
            Action: iam:DeleteRolePermissionsBoundary
            Resource: '*'
          - Sid: NeverEditBoundaryPolicy
            Effect: Deny
            Action:
              - iam:CreatePolicyVersion
              - iam:DeletePolicyVersion
              - iam:SetDefaultPolicyVersion
              - iam:DeletePolicy
            Resource: !Ref WorkloadPermissionsBoundary

  # Role assumed by GitHub Actions. It can only drive CloudFormation and
  # upload artifacts - the real permissions live in the execution role.
  GitHubDeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${ProjectName}-${Environment}-github-deploy
      Path: /bootstrap/
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                # Only jobs running in the matching GitHub Environment may assume this role
                token.actions.githubusercontent.com:sub: !Sub repo:${GitHubOrg}/${GitHubRepo}:environment:${Environment}
      Policies:
        - PolicyName: deploy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: CloudFormationStack
                Effect: Allow
                Action:
                  - cloudformation:CreateChangeSet
                  - cloudformation:DescribeChangeSet
                  - cloudformation:ExecuteChangeSet
                  - cloudformation:DeleteChangeSet
                  - cloudformation:ListChangeSets
                  - cloudformation:DescribeStacks
                  - cloudformation:DescribeStackEvents
                  - cloudformation:DescribeStackResources
                  - cloudformation:ListStackResources
                  - cloudformation:GetTemplate
                Resource:
                  - !Sub arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${ProjectName}-${Environment}/*
                  - !Sub arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${ProjectName}-${Environment}-*/*
              - Sid: CloudFormationGlobal
                Effect: Allow
                Action:
                  - cloudformation:ValidateTemplate
                  - cloudformation:GetTemplateSummary
                Resource: '*'
              - Sid: Artifacts
                Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:GetObject
                  - s3:ListBucket
                  - s3:GetBucketLocation
                Resource:
                  - !GetAtt ArtifactBucket.Arn
                  - !Sub ${ArtifactBucket.Arn}/*
              - Sid: PassExecutionRole
                Effect: Allow
                Action: iam:PassRole
                Resource: !GetAtt CloudFormationExecutionRole.Arn
                Condition:
                  StringEquals:
                    iam:PassedToService: cloudformation.amazonaws.com

Outputs:
  ArtifactBucketName:
    Description: GitHub Environment variable ARTIFACT_BUCKET
    Value: !Ref ArtifactBucket
  GitHubDeployRoleArn:
    Description: GitHub Environment variable AWS_DEPLOY_ROLE_ARN
    Value: !GetAtt GitHubDeployRole.Arn
  CloudFormationExecutionRoleArn:
    Description: GitHub Environment variable CFN_EXECUTION_ROLE_ARN
    Value: !GetAtt CloudFormationExecutionRole.Arn
  PermissionsBoundaryArn:
    Description: Boundary every workload role must carry
    Value: !Ref WorkloadPermissionsBoundary
    Export:
      Name: !Sub ${ProjectName}-${Environment}:PermissionsBoundaryArn
