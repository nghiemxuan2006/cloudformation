AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Security layer - application secret, reusable IAM managed policies (one per
  capability) and workload roles composed from them. Every role carries the
  permissions boundary created by the bootstrap stack.

  Reuse model:
    * Policies are the shared building blocks -> attach them to any new role.
    * Roles are per workload (never share one role across unrelated functions).
    * ARNs are exported as <project>-<env>:<Name> for other stacks (!ImportValue).

Parameters:
  ProjectName:
    Type: String
  Environment:
    Type: String
  PermissionsBoundaryArn:
    Type: String
  ItemsTableArn:
    Type: String
  DataBucketArn:
    Type: String
  FileSystemArn:
    Type: String
  EfsAccessPointArn:
    Type: String
  DbSecretArn:
    Type: String

Resources:
  # ---------------------------------------------------------------------------
  # Application secret (e.g. third-party API key) - value edited/rotated out of band
  # ---------------------------------------------------------------------------
  AppSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub ${ProjectName}/${Environment}/app
      Description: !Sub Application secrets for ${ProjectName}-${Environment}
      GenerateSecretString:
        SecretStringTemplate: '{}'
        GenerateStringKey: apiKey
        PasswordLength: 32
        ExcludePunctuation: true

  # ---------------------------------------------------------------------------
  # Reusable managed policies (building blocks)
  # ---------------------------------------------------------------------------
  ItemsTableReadWritePolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub ${ProjectName}-${Environment}-items-table-rw
      Description: Read/write items in the Items DynamoDB table
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action:
              - dynamodb:GetItem
              - dynamodb:BatchGetItem
              - dynamodb:Query
              - dynamodb:PutItem
              - dynamodb:UpdateItem
              - dynamodb:DeleteItem
              - dynamodb:BatchWriteItem
            Resource:
              - !Ref ItemsTableArn
              - !Sub ${ItemsTableArn}/index/*

  ItemsTableReadOnlyPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub ${ProjectName}-${Environment}-items-table-ro
      Description: Read-only access to the Items DynamoDB table (reporting, workers...)
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action:
              - dynamodb:GetItem
              - dynamodb:BatchGetItem
              - dynamodb:Query
            Resource:
              - !Ref ItemsTableArn
              - !Sub ${ItemsTableArn}/index/*

  DataBucketReadWritePolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub ${ProjectName}-${Environment}-data-bucket-rw
      Description: Read/write objects in the data bucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action: s3:ListBucket
            Resource: !Ref DataBucketArn
          - Effect: Allow
            Action:
              - s3:GetObject
              - s3:PutObject
            Resource: !Sub ${DataBucketArn}/*

  AppSecretsReadPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub ${ProjectName}-${Environment}-secrets-read
      Description: Read the database and application secrets
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action: secretsmanager:GetSecretValue
            Resource:
              - !Ref DbSecretArn
              - !Ref AppSecret

  EfsClientPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub ${ProjectName}-${Environment}-efs-client
      Description: Mount and write the shared EFS through the Lambda access point
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action:
              - elasticfilesystem:ClientMount
              - elasticfilesystem:ClientWrite
            Resource: !Ref FileSystemArn
            Condition:
              StringEquals:
                elasticfilesystem:AccessPointArn: !Ref EfsAccessPointArn

  # ---------------------------------------------------------------------------
  # Workload roles (one per function / service)
  # ---------------------------------------------------------------------------
  ApiFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${ProjectName}-${Environment}-api-fn
      Description: Execution role for the API Lambda
      PermissionsBoundary: !Ref PermissionsBoundaryArn
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
        - !Ref ItemsTableReadWritePolicy
        - !Ref DataBucketReadWritePolicy
        - !Ref AppSecretsReadPolicy
        - !Ref EfsClientPolicy

Outputs:
  AppSecretArn:
    Value: !Ref AppSecret
    Export:
      Name: !Sub ${ProjectName}-${Environment}:AppSecretArn
  ApiFunctionRoleArn:
    Value: !GetAtt ApiFunctionRole.Arn
    Export:
      Name: !Sub ${ProjectName}-${Environment}:ApiFunctionRoleArn
  ItemsTableReadWritePolicyArn:
    Value: !Ref ItemsTableReadWritePolicy
    Export:
      Name: !Sub ${ProjectName}-${Environment}:ItemsTableReadWritePolicyArn
  ItemsTableReadOnlyPolicyArn:
    Value: !Ref ItemsTableReadOnlyPolicy
    Export:
      Name: !Sub ${ProjectName}-${Environment}:ItemsTableReadOnlyPolicyArn
  DataBucketReadWritePolicyArn:
    Value: !Ref DataBucketReadWritePolicy
    Export:
      Name: !Sub ${ProjectName}-${Environment}:DataBucketReadWritePolicyArn
  AppSecretsReadPolicyArn:
    Value: !Ref AppSecretsReadPolicy
    Export:
      Name: !Sub ${ProjectName}-${Environment}:AppSecretsReadPolicyArn
  EfsClientPolicyArn:
    Value: !Ref EfsClientPolicy
    Export:
      Name: !Sub ${ProjectName}-${Environment}:EfsClientPolicyArn
