AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Compute layer - Lambda function (in VPC, EFS mounted) fronted by an
  API Gateway HTTP API. IAM and secrets live in the security stack.

Parameters:
  ProjectName:
    Type: String
  Environment:
    Type: String
  PrivateSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
  LambdaSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
  ApiFunctionRoleArn:
    Type: String
  AppSecretArn:
    Type: String
  DataBucketName:
    Type: String
  ItemsTableName:
    Type: String
  EfsAccessPointArn:
    Type: String
  DbEndpoint:
    Type: String
  DbPort:
    Type: String
  DbName:
    Type: String
  DbSecretArn:
    Type: String
  CacheEndpoint:
    Type: String
  CachePort:
    Type: String
  LambdaMemorySize:
    Type: Number
  LambdaTimeout:
    Type: Number
  LogLevel:
    Type: String
  LogRetentionDays:
    Type: Number
  ApiThrottlingRateLimit:
    Type: Number
  ApiThrottlingBurstLimit:
    Type: Number

Resources:
  # ---------------------------------------------------------------------------
  # Lambda (execution role comes from the security stack)
  # ---------------------------------------------------------------------------
  ApiFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${ProjectName}-${Environment}-api
      RetentionInDays: !Ref LogRetentionDays

  ApiFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub ${ProjectName}-${Environment}-api
      Description: !Sub ${ProjectName} API (${Environment})
      Runtime: python3.12
      Architectures:
        - arm64
      Handler: app.handler
      # Local path - uploaded to S3 by `aws cloudformation package`
      Code: ../../build/lambda
      MemorySize: !Ref LambdaMemorySize
      Timeout: !Ref LambdaTimeout
      Role: !Ref ApiFunctionRoleArn
      LoggingConfig:
        LogGroup: !Ref ApiFunctionLogGroup
        LogFormat: JSON
        ApplicationLogLevel: !Ref LogLevel
        SystemLogLevel: WARN
      VpcConfig:
        SubnetIds: !Ref PrivateSubnetIds
        SecurityGroupIds:
          - !Ref LambdaSecurityGroupId
      FileSystemConfigs:
        - Arn: !Ref EfsAccessPointArn
          LocalMountPath: /mnt/efs
      Environment:
        Variables:
          ENVIRONMENT: !Ref Environment
          ITEMS_TABLE_NAME: !Ref ItemsTableName
          DATA_BUCKET_NAME: !Ref DataBucketName
          EFS_MOUNT_PATH: /mnt/efs
          DB_HOST: !Ref DbEndpoint
          DB_PORT: !Ref DbPort
          DB_NAME: !Ref DbName
          DB_SECRET_ARN: !Ref DbSecretArn
          APP_SECRET_ARN: !Ref AppSecretArn
          CACHE_HOST: !Ref CacheEndpoint
          CACHE_PORT: !Ref CachePort

  # ---------------------------------------------------------------------------
  # API Gateway (HTTP API)
  # ---------------------------------------------------------------------------
  HttpApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub ${ProjectName}-${Environment}-api
      ProtocolType: HTTP

  HttpApiIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt ApiFunction.Arn
      PayloadFormatVersion: '2.0'

  HttpApiDefaultRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: $default
      Target: !Sub integrations/${HttpApiIntegration}

  HttpApiAccessLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/apigateway/${ProjectName}-${Environment}-api
      RetentionInDays: !Ref LogRetentionDays

  HttpApiStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref HttpApi
      StageName: $default
      AutoDeploy: true
      DefaultRouteSettings:
        ThrottlingRateLimit: !Ref ApiThrottlingRateLimit
        ThrottlingBurstLimit: !Ref ApiThrottlingBurstLimit
      AccessLogSettings:
        DestinationArn: !GetAtt HttpApiAccessLogGroup.Arn
        Format: >-
          {"requestId":"$context.requestId","ip":"$context.identity.sourceIp",
          "method":"$context.httpMethod","path":"$context.path",
          "status":"$context.status","latency":"$context.responseLatency",
          "integrationError":"$context.integrationErrorMessage"}

  ApiInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ApiFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*

Outputs:
  ApiUrl:
    Value: !GetAtt HttpApi.ApiEndpoint
  FunctionName:
    Value: !Ref ApiFunction
