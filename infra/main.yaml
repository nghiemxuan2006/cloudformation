AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Root stack - Serverless API: API Gateway -> Lambda (VPC) -> EFS, Aurora
  PostgreSQL, ElastiCache, DynamoDB, S3, Secrets Manager (via VPC endpoints).

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label: { default: General }
        Parameters: [ProjectName, Environment]
      - Label: { default: Network }
        Parameters: [VpcCidr, PrivateSubnet1Cidr, PrivateSubnet2Cidr]
      - Label: { default: Database }
        Parameters:
          - DbEngineVersion
          - DbName
          - DbMinCapacity
          - DbMaxCapacity
          - DbEnableReader
          - DbBackupRetentionDays
      - Label: { default: Cache }
        Parameters: [CacheEngineVersion, CacheNodeType, CacheNumNodes]
      - Label: { default: Compute }
        Parameters:
          - LambdaMemorySize
          - LambdaTimeout
          - LogLevel
          - ApiThrottlingRateLimit
          - ApiThrottlingBurstLimit
      - Label: { default: Data protection & operations }
        Parameters:
          - EnableDeletionProtection
          - EnablePointInTimeRecovery
          - EnableEfsBackup
          - LogRetentionDays

Parameters:
  # General ------------------------------------------------------------------
  ProjectName:
    Type: String
    AllowedPattern: '^[a-z][a-z0-9-]{1,11}$'
    Description: Short lowercase project identifier (used in resource names)
  Environment:
    Type: String
    AllowedValues: [dev, test, prod]

  # Network ------------------------------------------------------------------
  VpcCidr:
    Type: String
    AllowedPattern: '^(\d{1,3}\.){3}\d{1,3}/\d{1,2}$'
  PrivateSubnet1Cidr:
    Type: String
    AllowedPattern: '^(\d{1,3}\.){3}\d{1,3}/\d{1,2}$'
  PrivateSubnet2Cidr:
    Type: String
    AllowedPattern: '^(\d{1,3}\.){3}\d{1,3}/\d{1,2}$'

  # Database -----------------------------------------------------------------
  DbEngineVersion:
    Type: String
    Default: '16.4'
  DbName:
    Type: String
    Default: appdb
    AllowedPattern: '^[a-zA-Z][a-zA-Z0-9_]{0,62}$'
  DbMinCapacity:
    Type: Number
    Default: 0.5
  DbMaxCapacity:
    Type: Number
    Default: 2
  DbEnableReader:
    Type: String
    AllowedValues: ['true', 'false']
    Default: 'false'
  DbBackupRetentionDays:
    Type: Number
    MinValue: 1
    MaxValue: 35
    Default: 1

  # Cache --------------------------------------------------------------------
  CacheEngineVersion:
    Type: String
    Default: '7.2'
  CacheNodeType:
    Type: String
    Default: cache.t4g.micro
  CacheNumNodes:
    Type: Number
    MinValue: 1
    MaxValue: 6
    Default: 1

  # Compute ------------------------------------------------------------------
  LambdaMemorySize:
    Type: Number
    MinValue: 128
    MaxValue: 10240
    Default: 512
  LambdaTimeout:
    Type: Number
    MinValue: 3
    MaxValue: 29   # HTTP API integration timeout is 30s
    Default: 15
  LogLevel:
    Type: String
    AllowedValues: [DEBUG, INFO, WARN, ERROR]
    Default: INFO
  ApiThrottlingRateLimit:
    Type: Number
    Default: 50
  ApiThrottlingBurstLimit:
    Type: Number
    Default: 100

  # Data protection & operations --------------------------------------------
  EnableDeletionProtection:
    Type: String
    AllowedValues: ['true', 'false']
    Default: 'false'
  EnablePointInTimeRecovery:
    Type: String
    AllowedValues: ['true', 'false']
    Default: 'false'
  EnableEfsBackup:
    Type: String
    AllowedValues: ['true', 'false']
    Default: 'false'
  LogRetentionDays:
    Type: Number
    AllowedValues: [1, 3, 5, 7, 14, 30, 60, 90, 120, 150, 180, 365]
    Default: 14

Resources:
  # Every IAM role below is created with the permissions boundary from
  # bootstrap/bootstrap.yaml (policy/boundaries/<project>-<env>-boundary).
  NetworkStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: ./stacks/network.yaml
      Parameters:
        ProjectName: !Ref ProjectName
        Environment: !Ref Environment
        VpcCidr: !Ref VpcCidr
        PrivateSubnet1Cidr: !Ref PrivateSubnet1Cidr
        PrivateSubnet2Cidr: !Ref PrivateSubnet2Cidr
        FlowLogRetentionDays: !Ref LogRetentionDays
        PermissionsBoundaryArn: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:policy/boundaries/${ProjectName}-${Environment}-boundary

  StorageStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: ./stacks/storage.yaml
      Parameters:
        ProjectName: !Ref ProjectName
        Environment: !Ref Environment
        PrivateSubnetIds: !GetAtt NetworkStack.Outputs.PrivateSubnetIds
        EfsSecurityGroupId: !GetAtt NetworkStack.Outputs.EfsSecurityGroupId
        EnablePointInTimeRecovery: !Ref EnablePointInTimeRecovery
        EnableEfsBackup: !Ref EnableEfsBackup

  DatabaseStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: ./stacks/database.yaml
      Parameters:
        ProjectName: !Ref ProjectName
        Environment: !Ref Environment
        PrivateSubnetIds: !GetAtt NetworkStack.Outputs.PrivateSubnetIds
        DatabaseSecurityGroupId: !GetAtt NetworkStack.Outputs.DatabaseSecurityGroupId
        DbEngineVersion: !Ref DbEngineVersion
        DbName: !Ref DbName
        DbMinCapacity: !Ref DbMinCapacity
        DbMaxCapacity: !Ref DbMaxCapacity
        DbEnableReader: !Ref DbEnableReader
        DbBackupRetentionDays: !Ref DbBackupRetentionDays
        EnableDeletionProtection: !Ref EnableDeletionProtection

  CacheStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: ./stacks/cache.yaml
      Parameters:
        ProjectName: !Ref ProjectName
        Environment: !Ref Environment
        PrivateSubnetIds: !GetAtt NetworkStack.Outputs.PrivateSubnetIds
        CacheSecurityGroupId: !GetAtt NetworkStack.Outputs.CacheSecurityGroupId
        CacheEngineVersion: !Ref CacheEngineVersion
        CacheNodeType: !Ref CacheNodeType
        CacheNumNodes: !Ref CacheNumNodes

  SecurityStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: ./stacks/security.yaml
      Parameters:
        ProjectName: !Ref ProjectName
        Environment: !Ref Environment
        PermissionsBoundaryArn: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:policy/boundaries/${ProjectName}-${Environment}-boundary
        ItemsTableArn: !GetAtt StorageStack.Outputs.ItemsTableArn
        DataBucketArn: !GetAtt StorageStack.Outputs.DataBucketArn
        FileSystemArn: !GetAtt StorageStack.Outputs.FileSystemArn
        EfsAccessPointArn: !GetAtt StorageStack.Outputs.EfsAccessPointArn
        DbSecretArn: !GetAtt DatabaseStack.Outputs.SecretArn

  ComputeStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: ./stacks/compute.yaml
      Parameters:
        ProjectName: !Ref ProjectName
        Environment: !Ref Environment
        PrivateSubnetIds: !GetAtt NetworkStack.Outputs.PrivateSubnetIds
        LambdaSecurityGroupId: !GetAtt NetworkStack.Outputs.LambdaSecurityGroupId
        ApiFunctionRoleArn: !GetAtt SecurityStack.Outputs.ApiFunctionRoleArn
        AppSecretArn: !GetAtt SecurityStack.Outputs.AppSecretArn
        DataBucketName: !GetAtt StorageStack.Outputs.DataBucketName
        ItemsTableName: !GetAtt StorageStack.Outputs.ItemsTableName
        EfsAccessPointArn: !GetAtt StorageStack.Outputs.EfsAccessPointArn
        DbEndpoint: !GetAtt DatabaseStack.Outputs.ClusterEndpoint
        DbPort: !GetAtt DatabaseStack.Outputs.Port
        DbName: !GetAtt DatabaseStack.Outputs.DbName
        DbSecretArn: !GetAtt DatabaseStack.Outputs.SecretArn
        CacheEndpoint: !GetAtt CacheStack.Outputs.PrimaryEndpointAddress
        CachePort: !GetAtt CacheStack.Outputs.PrimaryEndpointPort
        LambdaMemorySize: !Ref LambdaMemorySize
        LambdaTimeout: !Ref LambdaTimeout
        LogLevel: !Ref LogLevel
        LogRetentionDays: !Ref LogRetentionDays
        ApiThrottlingRateLimit: !Ref ApiThrottlingRateLimit
        ApiThrottlingBurstLimit: !Ref ApiThrottlingBurstLimit

Outputs:
  ApiUrl:
    Description: Base URL of the HTTP API
    Value: !GetAtt ComputeStack.Outputs.ApiUrl
  FunctionName:
    Value: !GetAtt ComputeStack.Outputs.FunctionName
  DataBucketName:
    Value: !GetAtt StorageStack.Outputs.DataBucketName
  ItemsTableName:
    Value: !GetAtt StorageStack.Outputs.ItemsTableName
  DbClusterEndpoint:
    Value: !GetAtt DatabaseStack.Outputs.ClusterEndpoint
  DbSecretArn:
    Value: !GetAtt DatabaseStack.Outputs.SecretArn
  ApiFunctionRoleArn:
    Value: !GetAtt SecurityStack.Outputs.ApiFunctionRoleArn
  CacheEndpoint:
    Value: !GetAtt CacheStack.Outputs.PrimaryEndpointAddress
  VpcId:
    Value: !GetAtt NetworkStack.Outputs.VpcId
